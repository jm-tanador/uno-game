<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNO Rooms</title>
<style>
:root{--R:#e2352f;--Y:#f6c343;--G:#2f9d55;--B:#1f74d4;--felt:#0d3b30}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 20%,#1b6a52,var(--felt) 65%)}
main{max-width:920px;margin:auto;padding:16px;display:flex;flex-direction:column;gap:18px;min-height:100vh}
h1{margin:8px 0 0;text-align:center;font-size:3.4rem;font-style:italic;letter-spacing:3px;color:var(--Y);text-shadow:3px 3px 0 var(--R)}
[hidden]{display:none!important}
.panel{background:#0007;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;max-width:380px;width:100%;margin:0 auto}
input,button{font:inherit;padding:13px;border-radius:12px;border:0}
button{background:var(--Y);color:#222;cursor:pointer}
button.sec{background:#fff2;color:#fff}
button:disabled{opacity:.4;cursor:default}
input:focus-visible,button:focus-visible{outline:3px solid #fff}
.code{font-size:3rem;letter-spacing:10px;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.opp{background:#0006;padding:8px 16px;border-radius:12px;text-align:center;border:2px solid transparent}
.opp.turn{border-color:var(--Y)}
.card{width:64px;height:96px;border-radius:10px;border:3px solid #fff;display:grid;place-items:center;font-size:1.5rem;color:#fff;background:#222;box-shadow:0 3px 8px #0007;user-select:none;padding:0;text-shadow:1px 1px 0 #0005}
.card.R{background:var(--R)}.card.G{background:var(--G)}.card.B{background:var(--B)}
.card.Y{background:var(--Y);color:#222;text-shadow:none}
.card.W{background:conic-gradient(var(--R) 0 25%,var(--Y) 0 50%,var(--G) 0 75%,var(--B) 0)}
.card.back{background:#151515;color:var(--R);font-style:italic;font-size:1.3rem}
.mid{gap:22px}.mid .card{width:84px;height:126px;font-size:2.1rem}
.dot{width:28px;height:28px;border-radius:50%;border:3px solid #fff}
.hand{padding-top:18px}
.hand .card{cursor:pointer;opacity:.45;transition:transform .12s}
.hand .card.ok{opacity:1}.hand .card.ok:hover{transform:translateY(-14px)}
.status{text-align:center;font-size:1.2rem;min-height:1.5em}
.log{text-align:center;opacity:.7;font-size:.85rem;margin-top:auto}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:9}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}.picks button{height:64px;color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#222;padding:10px 18px;border-radius:12px;z-index:10}
</style>
</head>
<body>
<main>
  <h1>UNO</h1>
  <div id="app"></div>
</main>
<div id="pick" class="modal" hidden><div class="panel"><div class="status">Choose a color</div>
  <div class="picks">
    <button style="background:var(--R)" onclick="pickc('R')">Red</button>
    <button style="background:var(--Y);color:#222" onclick="pickc('Y')">Yellow</button>
    <button style="background:var(--G)" onclick="pickc('G')">Green</button>
    <button style="background:var(--B)" onclick="pickc('B')">Blue</button>
  </div></div></div>
<div id="toast" hidden></div>
<script>
const $ = (s) => document.querySelector(s);
const L = { S: "⊘", R: "⇄", D: "+2", W: "★", F: "+4" };
const lbl = (c) => L[c.v] || c.v;
const esc = (s) => s.replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
let S = null, pid = localStorage.uno_pid, code = localStorage.uno_code, pend = null, last = "";

function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600); }
async function api(b) {
  const r = await fetch("/api/game", { method: "POST", body: JSON.stringify({ pid, code, ...b }) });
  const d = await r.json();
  if (!r.ok) { if (r.status === 404 && S) leave(); toast(d.error); throw 0; }
  return d;
}
function apply(d) {
  if (d.pid) { pid = d.pid; localStorage.uno_pid = pid; }
  code = d.code; localStorage.uno_code = code;
  const j = JSON.stringify(d); if (j === last) return; last = j;
  S = d; render();
}
const act = (action, extra = {}) => api({ action, ...extra }).then(apply).catch(() => {});
function go(action) {
  const name = $("#nm").value.trim() || "Player"; localStorage.uno_name = name;
  const body = { action, name }; if (action === "join") body.code = $("#cd").value;
  api(body).then(apply).catch(() => {});
}
function leave() { pid = code = null; localStorage.removeItem("uno_pid"); localStorage.removeItem("uno_code"); S = null; last = ""; render(); }
const ok = (c) => S.turn === S.me && !S.winner && (c.c === "W" || c.c === S.color || c.v === S.top.v);
function play(i) {
  const c = S.hand[i]; if (!ok(c)) return;
  if (c.c === "W") { pend = i; $("#pick").hidden = false; } else act("play", { idx: i });
}
function pickc(color) { $("#pick").hidden = true; act("play", { idx: pend, color }); }

function render() {
  const app = $("#app");
  if (!S) {
    app.innerHTML = `<div class="panel">
      <input id="nm" placeholder="Your name" maxlength="16" value="${esc(localStorage.uno_name || "")}">
      <button onclick="go('create')">Create room</button>
      <input id="cd" placeholder="Room code" maxlength="4" style="text-transform:uppercase">
      <button class="sec" onclick="go('join')">Join room</button></div>`;
    return;
  }
  if (!S.started) {
    app.innerHTML = `<div class="panel"><div>Room code — share it with your friends</div>
      <div class="code">${S.code}</div>
      <div>Players: ${S.players.map((p) => esc(p.name)).join(", ")}</div>
      ${S.me === 0 ? `<button ${S.players.length < 2 ? "disabled" : ""} onclick="act('start')">Start game</button>` : "<div>Waiting for the host to start…</div>"}
      <button class="sec" onclick="leave()">Leave room</button></div>`;
    return;
  }
  const mine = S.turn === S.me, cur = S.players[S.turn];
  app.innerHTML = `
    <div class="row">${S.players.map((p, i) => i === S.me ? "" : `<div class="opp ${i === S.turn ? "turn" : ""}"><b>${esc(p.name)}</b><br>${p.n} cards${p.n === 1 ? " · UNO!" : ""}</div>`).join("")}</div>
    <div class="row mid">
      <button class="card back" onclick="act('draw')" ${mine && !S.winner ? "" : "disabled"} title="Draw a card">UNO</button>
      <div class="card ${S.top.c}">${lbl(S.top)}</div>
      <div class="dot" style="background:var(--${S.color})" title="Current color"></div>
    </div>
    <div class="status">${mine ? "<b>Your turn</b> — play a card or draw" : esc(cur.name) + "'s turn"}</div>
    <div class="row hand">${S.hand.map((c, i) => `<div class="card ${c.c} ${mine && ok(c) ? "ok" : ""}" onclick="play(${i})">${lbl(c)}</div>`).join("")}</div>
    <div class="log">${S.log.map(esc).join("<br>")}</div>
    ${S.winner ? `<div class="modal"><div class="panel"><div class="status"><b>${esc(S.winner)} wins!</b></div>${S.me === 0 ? `<button onclick="act('start')">Play again</button>` : "<div class='status'>Waiting for the host…</div>"}<button class="sec" onclick="leave()">Leave room</button></div></div>` : ""}`;
}
async function tick() { if (code && pid) { try { apply(await api({ action: "state" })); } catch {} } }
render(); tick(); setInterval(tick, 1500);
</script>
</body>
</html>
